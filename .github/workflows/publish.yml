name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check if version needs publishing
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @bitclaw/disposable-email version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for OIDC trusted publishing support
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest
      - run: bun run lint
        if: steps.check.outputs.publish == 'true'
      - run: bun run typecheck
        if: steps.check.outputs.publish == 'true'
      - run: bun run test
        if: steps.check.outputs.publish == 'true'
      - run: bun run build
        if: steps.check.outputs.publish == 'true'
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.local }}"
          git push origin "v${{ steps.check.outputs.local }}"
