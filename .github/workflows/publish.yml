name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check if version needs publishing
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @bitclaw/disposable-email version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for OIDC trusted publishing support
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@11.21.0
      - run: bun run lint
        if: steps.check.outputs.publish == 'true'
      - run: bun run typecheck
        if: steps.check.outputs.publish == 'true'
      - run: bun run test
        if: steps.check.outputs.publish == 'true'
      - run: bun run build
        if: steps.check.outputs.publish == 'true'
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.local }}"
          git push origin "v${{ steps.check.outputs.local }}"
